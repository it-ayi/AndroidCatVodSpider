name: Spider Jar Gen CI

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v2.4.0  # 使用具体版本以提高稳定性

      - name: Set up JDK 17
        uses: actions/setup-java@v2.4.0  # 使用具体版本以提高稳定性
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: gradle

      - name: Build with Gradle
        run: ./build.bat ec

      - name: Check if JAR exists
        shell: pwsh  # 指定使用 PowerShell 作为 shell
        run: |
          if (-Not (Test-Path "./jar/custom_spider.jar")) {
            echo "JAR file not found!"
            exit 1
          } else {
            echo "JAR file exists."
          }

      - name: Update spider jar
        uses: EndBug/add-and-commit@v7
        with:
          default_author: github_actions
          message: 'update spider jar'
          add: |
            ./jar/custom_spider.jar
            ./jar/custom_spider.jar.md5
